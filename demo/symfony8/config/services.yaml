services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'


# The anonymize bundle (and its nowo_anonymize.faker_factory service) is loaded in dev/test only.
# The anonymizer can stay private: the bundle resolves it from its plugin locator
# (every service implementing EntityAnonymizerServiceInterface).
when@dev: &anonymizer_services
    services:
        App\Service\SmsNotificationAnonymizerService:
            autowire: true
            arguments:
                $fakerFactory: '@nowo_anonymize.faker_factory'

when@test: *anonymizer_services

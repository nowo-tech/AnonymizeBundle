# CI: tests on PHP 8.2–8.5 × Symfony 6.4, 7.0, 7.4, 8.1 (exclusions for incompatible pairs).
# Coverage with PCOV; release updated via release.yml on tag push.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): one representative cell plus the cheap
  # gates. The org (or repo) Actions variable NOWO_CI_PR_MODE picks the PR mode: light = every PR light; full = every
  # PR full; auto / unset = light only when the PR touches nothing but composer.json / composer.lock (root or demo),
  # docs/**, *.md, .github/ISSUE_TEMPLATE/**, specs/** or .cursor/**. push, tags, workflow_dispatch and schedule are
  # always full. Fail-closed: any error, unknown value or empty output means full (jobs reduce only on 'light').
  changes:
    name: Change scope (light or full)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code (PR merge commit and its base parent)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.NOWO_CI_PR_MODE }}
          LIGHT: '^((demo/([^/]+/)?)?composer\.(json|lock)|docs/.*|specs/.*|\.cursor/.*|\.github/ISSUE_TEMPLATE/.*|.*\.md)$'
        run: |
          mode=full; paths=""
          if [ "$EVENT" != pull_request ]; then
            reason="event '$EVENT' always runs full"
          else
            case "$SWITCH" in
              light) mode=light; reason="NOWO_CI_PR_MODE=light: every PR is light" ;;
              full) reason="NOWO_CI_PR_MODE=full: every PR is full" ;;
              ''|auto)
                if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
                  mode=light; reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): only deps/docs paths changed"
                  while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    if ! printf '%s\n' "$f" | grep -Eq "$LIGHT"; then mode=full; paths="$paths $f"; fi
                  done <<< "$files"
                  [ "$mode" = light ] || reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): non deps/docs paths changed:$paths"
                else
                  reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): git diff failed, fail-closed"
                fi ;;
              *) reason="NOWO_CI_PR_MODE='$SWITCH' is not light/auto/full, fail-closed" ;;
            esac
          fi
          echo "mode=$mode ($reason)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### CI mode: \`$mode\`"
            echo ""
            echo "$reason"
            if [ "$EVENT" = pull_request ] && [ -n "${files:-}" ]; then echo ""; echo "Changed paths:"; echo '```'; echo "$files" | head -200; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    needs: changes
    # Never skip this job: a skipped matrix job reports its un-expanded name and the required contexts never
    # appear. In light mode its steps are gated by HEAVY instead.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['6.4', '7.0', '7.4', '8.1']
        exclude:
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.1') }}
    steps:
      - name: Light mode (deps/docs-only PR) - covered by PHP 8.5 - Symfony 8.1
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        uses: actions/checkout@v7
        if: env.HEAVY == 'true'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo, pdo_mysql, pdo_pgsql
          coverage: pcov
          tools: composer:v2
        if: env.HEAVY == 'true'

      - name: Validate composer.json
        run: composer validate --strict
        if: env.HEAVY == 'true'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        if: env.HEAVY == 'true'

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-
        if: env.HEAVY == 'true'

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        run: composer config platform.php "${{ matrix.php }}.99"
        if: env.HEAVY == 'true'

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        run: |
          composer require symfony/config:^${{ matrix.symfony }} symfony/dependency-injection:^${{ matrix.symfony }} symfony/http-kernel:^${{ matrix.symfony }} symfony/yaml:^${{ matrix.symfony }} --no-interaction --no-update
          composer update --no-interaction --prefer-dist --no-progress
        if: env.HEAVY == 'true'
      - name: Composer audit (Critical/High)
        run: composer audit --locked
        if: env.HEAVY == 'true'


      - name: Run tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "🧪 Running tests on PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }}..."
          composer test
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"
        if: env.HEAVY == 'true'

      - name: Run tests with coverage (PHP 8.2 + Symfony 7.0 only)
        if: env.HEAVY == 'true' && (matrix.php == '8.2' && matrix.symfony == '7.0')
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "📊 Generating coverage report..."
          composer test-coverage
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed when generating coverage"
            exit 1
          fi
          echo "✅ Coverage generated"

  postgres:
    name: PostgreSQL (case-folded columns, audits LQ-N-D-L1, LQ-N-D2-L1)
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as success).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: anonymize
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo, pdo_pgsql, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run the PostgreSQL group
        env:
          ANONYMIZE_TEST_POSTGRES_URL: pgsql://postgres@127.0.0.1:5432/anonymize?serverVersion=17
        run: vendor/bin/phpunit --no-coverage --group postgres --fail-on-skipped

  # REQ-RUNTIME-003: two real connections (the anonymizer and the application) on MySQL 8.4, MariaDB 11.4 and
  # PostgreSQL 16, on DBAL 4 and DBAL 3. Both sessions use a 1 s lock timeout, so a missing lock fails fast.
  load:
    name: Load readiness (${{ matrix.name }})
    needs: changes
    # Never skip this job: a skipped matrix job reports its un-expanded name and the required contexts never
    # appear. In light mode its steps are gated by HEAVY instead.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'MySQL 8.4', url: 'mysql://root@127.0.0.1:3306/anonymize?serverVersion=8.4.0&charset=utf8mb4', dbal: '' }
          - { name: 'MariaDB 11.4', url: 'mysql://root@127.0.0.1:3307/anonymize?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '' }
          - { name: 'PostgreSQL 16', url: 'postgresql://postgres@127.0.0.1:5432/anonymize?serverVersion=16&charset=utf8', dbal: '' }
          - { name: 'MySQL 8.4, DBAL 3', url: 'mysql://root@127.0.0.1:3306/anonymize?serverVersion=8.4.0&charset=utf8mb4', dbal: '^3.8.2' }
          - { name: 'MariaDB 11.4, DBAL 3', url: 'mysql://root@127.0.0.1:3307/anonymize?serverVersion=11.4.0-MariaDB&charset=utf8mb4', dbal: '^3.8.2' }
          - { name: 'PostgreSQL 16, DBAL 3', url: 'postgresql://postgres@127.0.0.1:5432/anonymize?serverVersion=16&charset=utf8', dbal: '^3.8.2' }
    services:
      mysql:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: anonymize
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: anonymize
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: ${{ needs.changes.outputs.mode != 'light' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: anonymize
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
    steps:
      - name: Light mode (deps/docs-only PR) - no database run
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        uses: actions/checkout@v7
        if: env.HEAVY == 'true'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
          tools: composer:v2
        if: env.HEAVY == 'true'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        if: env.HEAVY == 'true'

      - name: Use DBAL 3
        if: env.HEAVY == 'true' && matrix.dbal != ''
        run: composer require --no-interaction --no-progress --with-all-dependencies "doctrine/dbal:${{ matrix.dbal }}"

      - name: Two-connection race and lock wait tests
        timeout-minutes: 10
        env:
          ANONYMIZE_TEST_DATABASE_URL: ${{ matrix.url }}
        # By path: some unit tests declare DBAL 4-only driver stubs, which cannot be loaded on DBAL 3
        run: vendor/bin/phpunit --no-coverage --fail-on-skipped tests/Integration/Concurrency
        if: env.HEAVY == 'true'

      - name: Unit and integration suites (DBAL 4)
        if: env.HEAVY == 'true' && matrix.dbal == ''
        timeout-minutes: 10
        run: vendor/bin/phpunit --no-coverage

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (a host
  # can run `composer update nowo-tech/anonymize-bundle` without updating them), and the demo lock must install what
  # the bundle requires (the demo installs from its lock, so a requirement added later is never installed and Demo
  # smoke fails with "class not found").
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo, pdo_sqlite
          tools: composer:v2

      # From the lock (as the PHPStan job resolves it), so only nowo-tech/transaction-* moves
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Unit and integration suites at the floor
        timeout-minutes: 10
        run: vendor/bin/phpunit --no-coverage

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- '*.php')" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u -- '*.php'
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: composer cs-check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: PHPStan (level and ignoreErrors from phpstan.neon.dist; fails the build on any error)
        run: composer phpstan --no-interaction

  igor:
    name: Igor (FrankenPHP worker audit)
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as success).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor

  coverage:
    name: Code Coverage
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as success).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo, pdo_mysql, pdo_pgsql
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies (Symfony 7.0)
        run: |
          composer require symfony/config:^7.0 symfony/dependency-injection:^7.0 symfony/http-kernel:^7.0 symfony/yaml:^7.0 --no-interaction --no-update
          composer update --no-interaction --prefer-dist --no-progress

      - name: Run tests with coverage
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "🧪 Running tests with coverage..."
          rm -rf .phpunit.cache
          composer test-coverage
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Enforce coverage gate (REQ-TEST-003)
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi
          METRICS_LINE=$(grep -m1 '<metrics files=' coverage.xml)
          STATEMENTS=$(echo "$METRICS_LINE" | sed -E 's/.* statements="([0-9]+)".*/\1/')
          COVERED=$(echo "$METRICS_LINE" | sed -E 's/.* coveredstatements="([0-9]+)".*/\1/')
          echo "Covered statements: ${COVERED}/${STATEMENTS}"
          # The whole of src/ is covered (no exclusions in phpunit.xml.dist); any uncovered statement fails the build.
          if [ "$STATEMENTS" -eq 0 ] || [ "$COVERED" -ne "$STATEMENTS" ]; then
            echo "ERROR: PHP coverage must be 100% of src/ (${COVERED}/${STATEMENTS} statements covered)"
            echo "Uncovered statements:"
            awk '/<file name=/ { match($0, /name="[^"]*"/); f = substr($0, RSTART + 6, RLENGTH - 7) } /type="stmt"/ && /count="0"/ { match($0, /num="[0-9]+"/); print "  " f ":" substr($0, RSTART + 5, RLENGTH - 6) }' coverage.xml
            exit 1
          fi
          echo "✅ PHP coverage 100% (${COVERED}/${STATEMENTS})"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

# Maintainer: Héctor Franco Aceituno (@HecFranco)
# Organization: nowo-tech (https://github.com/nowo-tech)
